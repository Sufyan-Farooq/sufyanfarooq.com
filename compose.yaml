name: portfolio
services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PORT: 3000
      VISIT_SALT: ${VISIT_SALT:?Set VISIT_SALT in the server .env}
    volumes:
      - type: bind
        source: ./data/stats.json
        target: /app/stats.json
        bind:
          create_host_path: false
